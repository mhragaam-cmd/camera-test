<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تجربة الكاميرا</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #f5f5f5;
    }
    button {
      padding: 12px 22px;
      font-size: 18px;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
      border-radius: 12px;
      background: #222;
    }
    p { color: #444; }
  </style>
</head>
<body>
  <h2>تجربة تشغيل الكاميرا</h2>
  <p>اضغط على الزر واسمح للمتصفح باستخدام الكاميرا.</p>
  <button id="start">تشغيل الكاميرا</button>
  <br>
  <video id="camera" autoplay playsinline muted></video>
  <p id="message"></p>

  <script>
    const button = document.getElementById('start');
    const video = document.getElementById('camera');
    const message = document.getElementById('message');

    button.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });
        video.srcObject = stream;
        message.textContent = 'الكاميرا تعمل الآن.';
      } catch (error) {
        message.textContent =
          'تعذّر تشغيل الكاميرا. تأكد من السماح بإذن الكاميرا.';
      }
    });
  </script>
</body>
</html>
